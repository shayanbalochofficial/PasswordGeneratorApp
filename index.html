<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PassWord Generator</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
      integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <header>
      <nav>
        <ul></ul>
      </nav>
    </header>
    <main>
      <div class="container">
        <h1>
          Password Generator
          <hr />
        </h1>
        <!-- password continner -->
        <div class="passwordcontainer">
          <input type="text" readonly id="password" value="A@nya$h@yan  " />
          <i class="far fa-copy" id="copybtn" title="Copy To Clipboard"></i>
        </div>
        <!-- options section -->
        <div class="options">
          <label for="length">PassWord Length</label>
          <div class="rangecontainer">
            <input type="range" id="length" min="6" max="24" value="12" />
            <span id="lengthvalue">12</span>
          </div>
          <div class="option">
            <label for="uppercase">Include Uppercase</label>
            <input type="checkbox" id="uppercase" checked />
          </div>
          <div class="option">
            <label for="lowercase">Include Lowercase</label>
            <input type="checkbox" id="lowercase" checked />
          </div>
          <div class="option">
            <label for="numbers">Include Numbers</label>
            <input type="checkbox" id="numbers" checked />
          </div>
          <div class="option">
            <label for="symbols">Include Symbols</label>
            <input type="checkbox" id="symbols" checked />
          </div>
        </div>

        <!--  -->
        <button class="generatebtn">
          <i class="fas fa-key"></i>
          Generate Password
        </button>

        <div class="strengthcontainer">
          <p>Password Strength <span id="strengthlabel">Medium</span></p>
          <div class="strengthmeter">
            <div class="strengthbar"></div>
          </div>
        </div>
      </div>
    </main>
    <footer></footer>

    <script src="script.js"></script>
  </body>
</html>
